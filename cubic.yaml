# yaml-language-server: $schema=https://cubic.dev/schema/cubic-repository-config.schema.json
# cubic Configuration
version: 1

reviews:
  enabled: true
  sensitivity: high  # matches the "assertive" CodeRabbit profile
  incremental_commits: true
  check_drafts: false

  ignore:
    files:
      - "docs/**"
      - "**/*.md"
      - "**/testdata/**"
      - "**/fixtures/**"
      - "**/vendor/**"
      # The v1 tree (cmd/, tdns/), music/ and obe/ are frozen
      - "cmd/**"
      - "tdns/**"
      - "music/**"
      - "obe/**"
    pr_labels:
      - "skip-review"

# Keep the PR descriptions we write
pr_descriptions:
  generate: false

# Commits on PR branches come from us, signed; cubic only comments
issues:
  auto_fix: "off"  # quoted: a bare off is YAML for false
  pr_comment_fixes: false
  fix_with_cubic_buttons: false
