// BIND9 in both transfer roles.
//
//   b.ixfr.test    PRIMARY, driven by nsupdate. Dynamic update gives BIND a
//                  journal, which is what makes it able to answer IXFR at all
//                  -- and one delta per update, rather than whatever
//                  ixfr-from-differences would infer from a rewritten file.
//   c.ixfr.test    SECONDARY of the tdns primary: our OUTBOUND deltas, read by
//                  a foreign implementation.
//   casc.ixfr.test SECONDARY of the tdns SECONDARY: deltas this implementation
//                  RELAYED rather than originated (§5). The sharpest case in
//                  the rig -- a bug here ships corruption to a third party.
options {
	directory "/var/tmp/ixfrinterop/bind";
	pid-file "/var/tmp/ixfrinterop/run/named.pid";
	listen-on port 5323 { 127.0.0.1; };
	listen-on-v6 { none; };
	recursion no;
	dnssec-validation no;
	notify explicit;
	// Ask for incremental transfers and say so in the log, which is how the
	// rig counts them.
	request-ixfr yes;
	provide-ixfr yes;
};

logging {
	channel f { file "/var/tmp/ixfrinterop/log/named.log"; severity debug 3; print-time yes; };
	category default { f; };
	category xfer-in { f; };
	category xfer-out { f; };
	category update { f; };
	category notify { f; };
};

zone "b.ixfr.test" {
	type primary;
	file "/var/tmp/ixfrinterop/bind/b.ixfr.test.zone";
	allow-update { 127.0.0.1; };
	allow-transfer { 127.0.0.1; };
	also-notify { 127.0.0.1 port 5322; };
	notify explicit;
};

zone "c.ixfr.test" {
	type secondary;
	file "c.ixfr.test.db";
	primaries { 127.0.0.1 port 5321; };
	allow-transfer { 127.0.0.1; };
};

zone "casc.ixfr.test" {
	type secondary;
	file "casc.ixfr.test.db";
	primaries { 127.0.0.1 port 5322; };
	allow-transfer { 127.0.0.1; };
};
