# The rig's own CLI config. Without it the CLI falls back to
# /etc/tdns/tdns-cli.yaml, whose tdns-auth entry points at whatever daemon the
# operator normally runs -- so `zone update` reaches the wrong server and
# reports the rig's zones as unknown. --server does not override this for the
# API transport.
#
# The primary is reached over its local admin socket, found through its config
# file, so the rig's CLI runs as root. (There are no API keys; over TCP the CLI
# would need a client certificate in the daemon's access file.)
apiservers:
   - name:        auth
     config-file: /var/tmp/ixfrinterop/tdns-auth-p/tdns-auth-p.yaml
