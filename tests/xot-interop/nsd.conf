server:
	ip-address:	127.0.0.1@5303
	ip-address:	127.0.0.1@5403
	server-count:	1
	username:	""
	chroot:		""
	zonesdir:	"/var/tmp/xotinterop/nsd"
	pidfile:	"/var/tmp/xotinterop/run/nsd.pid"
	logfile:	"/var/tmp/xotinterop/log/nsd.log"
	verbosity:	3
	database:	""
	xfrdfile:	"/var/tmp/xotinterop/nsd/xfrd.state"
	zonelistfile:	"/var/tmp/xotinterop/nsd/zone.list"
	xfrdir:		"/var/tmp/xotinterop/nsd/xfr"
	# --- XoT: serve DoT on 5403 (primary role) ---
	tls-port:	5403
	tls-service-key: "/var/tmp/xotinterop/certs/ns-nsd.xot.test.key"
	tls-service-pem: "/var/tmp/xotinterop/certs/ns-nsd.xot.test.crt"
	# --- XoT: CA used to verify peers (both roles) ---
	tls-cert-bundle: "/var/tmp/xotinterop/ca/xot-ca.crt"

remote-control:
	control-enable:	no

# How we authenticate tdns-auth's server certificate when we pull from it
tls-auth:
	name:		"tdnsauth"
	auth-domain-name: "ns-tdnsauth.xot.test"

# NEGATIVE: wrong authentication domain name
tls-auth:
	name:		"badname"
	auth-domain-name: "wrong.xot.test"

# Direction A: NSD is SECONDARY, pulls a.xot.test from tdns-auth over XoT
zone:
	name:		"a.xot.test"
	zonefile:	"a.xot.test.zone"
	request-xfr:	127.0.0.1@5401 NOKEY tdnsauth
	allow-notify:	127.0.0.1 NOKEY
	provide-xfr:	127.0.0.1 NOKEY

# Direction B: NSD is PRIMARY for b-nsd.xot.test, tdns-agent pulls it
zone:
	name:		"b-nsd.xot.test"
	zonefile:	"/var/tmp/xotinterop/zones/b-nsd.xot.test.zone"
	provide-xfr:	127.0.0.1 NOKEY
	notify:		127.0.0.1@5302 NOKEY

# NEGATIVE: must fail on hostname mismatch
zone:
	name:		"neg1.xot.test"
	zonefile:	"neg1.xot.test.zone"
	request-xfr:	127.0.0.1@5401 NOKEY badname

