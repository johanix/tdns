server:
    rundir: "/var/tmp/xotinterop/run/knot"
    listen: 127.0.0.1@5305
    listen-tls: 127.0.0.1@5405
    cert-file: "/var/tmp/xotinterop/certs/ns-knot.xot.test.crt"
    key-file: "/var/tmp/xotinterop/certs/ns-knot.xot.test.key"
    ca-file: "/var/tmp/xotinterop/ca/xot-ca.crt"

database:
    storage: "/var/tmp/xotinterop/knot/db"

log:
  - target: "/var/tmp/xotinterop/log/knot.log"
    any: debug

remote:
  # How we verify tdns-auth's server certificate: PKIX (ca-file + hostname)
  - id: tdnsauth
    address: 127.0.0.1@5401
    tls: on
    cert-hostname: [ "ns-tdnsauth.xot.test" ]

  # NEGATIVE: wrong hostname
  - id: tdnsauth-badname
    address: 127.0.0.1@5401
    tls: on
    cert-hostname: [ "wrong.xot.test" ]

  # NEGATIVE: wrong SPKI pin
  - id: tdnsauth-badpin
    address: 127.0.0.1@5401
    tls: on
    cert-key: [ "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=" ]

  # control: pull from NSD's DoT listener (OpenSSL server)
  - id: nsdprimary
    address: 127.0.0.1@5403
    tls: on
    cert-hostname: [ "ns-nsd.xot.test" ]

  - id: tdnsagent
    address: 127.0.0.1@5302

acl:
  - id: xfr-local
    address: 127.0.0.1
    action: [ transfer, notify ]

zone:
  # Direction A: Knot is SECONDARY, pulls a.xot.test from tdns-auth over XoT
  - domain: a.xot.test.
    master: tdnsauth
    storage: "/var/tmp/xotinterop/knot/zones"
    file: "a.xot.test.zone"
    zonefile-sync: 0
    acl: xfr-local

  # Direction B: Knot is PRIMARY for b-knot.xot.test
  - domain: b-knot.xot.test.
    file: "/var/tmp/xotinterop/zones/b-knot.xot.test.zone"
    acl: xfr-local
    notify: tdnsagent

  # NEGATIVE: must fail on hostname mismatch
  - domain: neg1.xot.test.
    master: tdnsauth-badname
    storage: "/var/tmp/xotinterop/knot/zones"
    file: "neg1.xot.test.zone"

  # NEGATIVE: must fail on pin mismatch
  - domain: neg2.xot.test.
    master: tdnsauth-badpin
    storage: "/var/tmp/xotinterop/knot/zones"
    file: "neg2.xot.test.zone"

  # CONTROL: Knot as secondary against NSD over XoT
  - domain: b-nsd.xot.test.
    master: nsdprimary
    storage: "/var/tmp/xotinterop/knot/zones"
    file: "b-nsd-via-knot.zone"

