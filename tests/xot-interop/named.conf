options {
	directory "/var/tmp/xotinterop/bind";
	pid-file "/var/tmp/xotinterop/run/named.pid";
	listen-on port 5304 { 127.0.0.1; };
	listen-on port 5404 tls bind-server-tls { 127.0.0.1; };
	listen-on-v6 { none; };
	recursion no;
	dnssec-validation no;
	notify explicit;
};

logging {
	channel f { file "/var/tmp/xotinterop/log/named.log"; severity debug 3; print-time yes; };
	category default { f; };
	category xfer-in { f; };
	category xfer-out { f; };
};

// How we verify tdns-auth's server certificate (PKIX)
tls tdnsauth-tls {
	ca-file "/var/tmp/xotinterop/ca/xot-ca.crt";
	remote-hostname "ns-tdnsauth.xot.test";
};

// NEGATIVE: correct CA, deliberately wrong expected hostname
tls badname-tls {
	ca-file "/var/tmp/xotinterop/ca/xot-ca.crt";
	remote-hostname "wrong.xot.test";
};

// Our own server certificate, for serving XoT
tls bind-server-tls {
	cert-file "/var/tmp/xotinterop/certs/ns-bind.xot.test.crt";
	key-file "/var/tmp/xotinterop/certs/ns-bind.xot.test.key";
};

// Direction A: BIND9 is SECONDARY, pulls a.xot.test from tdns-auth over XoT
zone "a.xot.test" {
	type secondary;
	file "a.xot.test.db";
	primaries { 127.0.0.1 port 5401 tls tdnsauth-tls; };
	allow-transfer { 127.0.0.1; };
};

// Direction B: BIND9 is PRIMARY for b-bind.xot.test
zone "b-bind.xot.test" {
	type primary;
	file "/var/tmp/xotinterop/zones/b-bind.xot.test.zone";
	allow-transfer { 127.0.0.1; };
	also-notify { 127.0.0.1 port 5302; };
};

// NEGATIVE: must fail on hostname mismatch
zone "neg1.xot.test" {
	type secondary;
	file "neg1.xot.test.db";
	primaries { 127.0.0.1 port 5401 tls badname-tls; };
};
