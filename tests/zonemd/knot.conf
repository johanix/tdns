server:
    rundir: "/var/tmp/zonemd/run/knot"
    listen: 127.0.0.1@5315

database:
    storage: "/var/tmp/zonemd/knot/db"

log:
  - target: "/var/tmp/zonemd/log/knot.log"
    any: info

remote:
  - id: tdnsauth
    address: 127.0.0.1@5311
  - id: tdnsagent
    address: 127.0.0.1@5312

acl:
  - id: local
    address: 127.0.0.1
    action: [ transfer, notify ]

zone:
  # Knot's gate, on a digest tdns produced: must accept
  - domain: good.zonemd.test.
    master: tdnsauth
    storage: "/var/tmp/zonemd/knot/zones"
    file: "good.zone"
    zonefile-sync: 0
    zonemd-verify: on
    acl: local

  # Knot's gate, on a wrong digest: must DISCARD the transfer
  - domain: bad.zonemd.test.
    master: tdnsauth
    storage: "/var/tmp/zonemd/knot/zones"
    file: "bad.zone"
    zonefile-sync: 0
    zonemd-verify: on
    acl: local

  # Knot generates the digest here; tdns-agent verifies it
  - domain: knotgen.zonemd.test.
    file: "/var/tmp/zonemd/zones/knotgen.zonemd.test.zone"
    zonemd-generate: zonemd-sha384
    notify: tdnsagent
    acl: local

  - domain: none.zonemd.test.
    master: tdnsauth
    storage: "/var/tmp/zonemd/knot/zones"
    file: "none.zone"
    zonefile-sync: 0
    zonemd-verify: on
    acl: local

  - domain: unsup.zonemd.test.
    master: tdnsauth
    storage: "/var/tmp/zonemd/knot/zones"
    file: "unsup.zone"
    zonefile-sync: 0
    zonemd-verify: on
    acl: local

