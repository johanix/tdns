options {
	directory "/var/tmp/ixfrtest/named";
	pid-file "/var/tmp/ixfrtest/named/named.pid";
	listen-on port 5401 { 127.0.0.1; };
	listen-on-v6 { none; };
	recursion no;
	dnssec-validation no;
	// The secondary must keep its journal, since that is what makes an
	// incremental transfer incremental. Default is fine; stated for clarity.
	ixfr-from-differences no;
};

logging {
	channel xferlog {
		file "/var/tmp/ixfrtest/named/xfer.log" versions 3 size 5m;
		severity debug 3;
		print-time yes;
	};
	// xfer-in is the category that says AXFR vs IXFR on the receiving side,
	// which is the whole point of using a real secondary here.
	category xfer-in { xferlog; };
	category notify  { xferlog; };
	category general { xferlog; };
};

zone "rig.example." {
	type secondary;
	primaries { 127.0.0.1 port 5400; };
	file "/var/tmp/ixfrtest/named/rig.example.db";
	// Accept NOTIFY from the primary on its non-standard port.
	allow-notify { 127.0.0.1; };
};
