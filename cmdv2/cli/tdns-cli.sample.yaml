# The `tdns-cli ... keystore <sig0|dnssec> algorithms` listing shows
# algorithm sizes, NIST level, maturity, and description — these come from
# the server (no config needed). The only extra data is per-CPU signing/
# validation cost, which is machine-dependent and optional:
#
# algorithms:
#    # Multi-arch cost table produced by dnssec-algorithms/cmd/algbench
#    # (algorithm-costs.yaml). Point at a copy, or at the file in a
#    # dnssec-algorithms checkout. Omit to show the listing without cost
#    # columns.
#    costsfile: /etc/tdns/algorithm-costs.yaml
#    # Which architecture's costs to show. Defaults to this host's arch.
#    # costarch: amd64

# apiservers: the daemons this CLI addresses. An entry's name is the command
# word that reaches it: "auth" is reached as `tdns-cli auth ...`. As root on
# the daemon's host,
#
#    tdns-ncli config add /etc/tdns/tdns-auth.yaml
#
# writes the entry for a daemon: config-file:, through which root reaches the
# daemon's local admin socket, and for a running daemon whose access file is
# there, its TCP address and the pins of its certificate (having enrolled
# your client certificate). tdns-ncli edits this file too:
# `tdns-ncli --config /etc/tdns/tdns-cli.yaml config add ...`.
#
# Over TCP the CLI verifies the daemon by its pins, and nothing else, and
# presents your client certificate (client: below, or the default that
# `tdns-ncli client init` makes), whose pin the daemon has in its access
# file. There are no API keys. An entry with only config-file: works for
# root on the daemon's host, over the socket.
apiservers:
   - name:              auth
     role:              auth
     config-file:       /etc/tdns/tdns-auth.yaml
     # Written by config add for a running daemon:
     # baseurl:         https://127.0.0.1:8989/api/v1
     # pins:            [ <the SPKI pin of the daemon's API certificate> ]

   - name:              agent
     role:              agent
     config-file:       /etc/tdns/tdns-agent.yaml

   - name:              imr
     role:              imr
     config-file:       /etc/tdns/tdns-imr.yaml

# The client certificate presented over TCP. Unset, the default pair is used
# (tdns-ncli client init makes it and prints its pin).
# client:
#    cert:              /etc/tdns/certs/tdns-ncli-client.crt
#    key:               /etc/tdns/certs/tdns-ncli-client.key

keys:
   tsig:
      - name:           johani.key.
        algorithm:      hmac-sha256
        secret:         fjvJ7KwoL7oX9n+L5sOwYJqyuxS8Jwt5k2M+JIwTQ7E=

      - name:           jonathan.key.
        algorithm:      hmac-sha256
        secret:         jkYMg8gccGs1upIgE+tLGAyquXDZyuc06YuFUPoM6Ac=

log:
   file:                /var/log/tdns/tdns-cli.log
   level:               info    # default level: debug|info|warn|error
