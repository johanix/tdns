# TDNS Zone Templates Configuration
#
# Templates allow you to define reusable zone configurations.
# Individual zones can reference a template and override specific settings.
#
# ==============================================================================
# SHAPE: templates: is a LIST, and every entry needs its own name:
# ==============================================================================
#
# A template is an ordinary zone declaration that carries a name and is not
# itself served. It therefore accepts every key a zone accepts (see
# auth-zones.sample.yaml), including primaries:, notify:, allow-notify:,
# downstreams:, updatepolicy: and delegationbackend:.
#
#     templates:
#        - name:   my-template
#          type:   primary
#          store:  map
#
# NOT a map keyed by template name. A mapping shape fails to load with
# "'templates': source data must be an array or slice, got map".
#
# ==============================================================================
# HOW A TEMPLATE MERGES INTO A ZONE
# ==============================================================================
#
# A zone opts in with `template: <name>`. The merge is a GAP FILL — the zone's
# own value always wins, and the template only supplies fields the zone left
# unset. Four rules are worth knowing:
#
#   1. options: is a UNION, not a gap fill. Template options are appended to the
#      zone's list. A zone can ADD options but cannot REMOVE one the template
#      supplies.
#
#   2. zonefile: in a template is a fmt.Sprintf PATTERN, %-substituted with the
#      zone name (which includes its trailing dot), not copied verbatim. So
#      `zonefile: /etc/tdns/zones/%szone` yields /etc/tdns/zones/example.org.zone
#      for zone example.org.  A pattern producing ".." is rejected.
#
#   3. dnssecpolicy: is gap-filled for tdns-auth, but never for tdns-agent
#      (agents do not sign).
#
#   4. A field counts as "set" only if it is non-zero. A zone therefore cannot
#      override a template value back to an empty/zero value ("", 0, false).
#      If a template sets `store: xfr`, a zone cannot revert it to the default
#      by writing `store: ""` — it must name the other value explicitly.
#
# name: and template: are never copied from a template. A template may itself
# set `template:` to inherit from another template; cycles are detected and
# rejected.
#
# DYNAMIC-ZONE BLESSING: a template carrying `dynamiczones: true` may be
# instantiated at runtime via the management API (tdns-cli auth zone add
# --type primary --template <name>), provided dynamiczones.dynamic.allowed
# includes "primary" in the main config. The flag marks the TEMPLATE as
# API-instantiable and is never copied to zones. This is the security
# envelope: an API client cannot express an update policy, it can only pick
# among templates you bless here. A blessed template for a dynamic primary
# must yield a zonefile (set a %s pattern) and must not use
# allow-child-updates, catalog-*, or multi-provider options (refused in v1).
#
# ==============================================================================
# COMPLETE LIST OF ZONE OPTIONS
# ==============================================================================
#
# DELEGATION SYNCHRONIZATION OPTIONS:
#   delegation-sync-parent:  Provide delegation sync service towards child zones
#                           (parent zone listens for child DS/NS/A/AAAA updates)
#
#   delegation-sync-child:   Attempt delegation sync with parent zone
#                           (child zone pushes DS/NS/A/AAAA updates to parent)
#
#   delegation-sync-proxy:   Agent secondary proxies CDS/CSYNC NOTIFYs upstream
#                           on behalf of a DSYNC-unaware primary
#                           (see guide/agent-dsync-proxy.md)
#
# ZONE MODIFICATION OPTIONS:
#   allow-updates:           Allow zone modifications via DNS UPDATE
#                           (general updates to any RRset in the zone)
#
#   allow-api-updates:       Allow zone modifications via the management API
#                           (tdns-cli auth zone update ...). A SEPARATE gate
#                           from allow-updates, which covers DNS UPDATE only:
#                           opening one channel never opens the other. A frozen
#                           zone refuses both.
#
#   allow-child-updates:     Allow updates to child delegation data via DNS UPDATE
#                           (only child NS, DS, A, AAAA records).
#                           Forced off if the child update policy type is
#                           "none" or unset. A zone with this option MUST also
#                           set delegationbackend:.
#
#   allow-edits:             Allow zone apex RRsets to be dynamically modified
#                           (NS, DNSKEY, CDS, CSYNC at zone apex)
#
# CONFLICT RESOLUTION OPTIONS:
#   These decide who wins when the zone file has been replaced behind the
#   server and its content contests a record the delta journal changed. The
#   two are MUTUALLY EXCLUSIVE: naming both is a hard config error. Exactly one
#   is always in force, because the parser materialises db-wins when neither is
#   given -- so `tdns-cli auth zone list` reports the policy the zone actually
#   runs under rather than a blank the operator has to interpret.
#
#   on-conflict-db-wins:     The journal's version of a contested record is
#                           served, and the zone file's losing records are
#                           written to the .rejected artefact. This is the
#                           DEFAULT. On a primary that also has
#                           allow-child-updates, it requires
#                           delegationbackend: direct -- a db or zonefile
#                           backend hands approved child updates to whatever
#                           generates the zone file, whose output db-wins has
#                           already declared it will overrule, and the
#                           combination is refused at startup.
#
#   on-conflict-zonefile-wins:   The zone file's version is served, and the
#                                journal's losing instructions go to the
#                                artefact instead. This is the setting for a
#                                zone whose file is generated elsewhere.
#
# DNSSEC OPTIONS:
#   online-signing:          Sign zone on-the-fly as needed
#                           (creates DNSSEC keypair if needed, signs responses)
#
#   inline-signing:          Maintain a signed copy of the zone
#
#                           BOTH signing options REQUIRE the zone to set
#                           dnssecpolicy:. Without one the option is dropped and
#                           the zone goes to ERROR state ("... is ignored because
#                           the DNSSEC policy is not set"). Neither is accepted
#                           by tdns-agent, which does not sign.
#
#   dont-publish-key:        Don't publish the public SIG(0) key in zone
#                           (key exists but is not published in zone data)
#
# DNS BEHAVIOR OPTIONS:
#   fold-case:               No-op. Name comparison is case-insensitive always.
#                           (case-insensitive matching for owner names)
#
#   black-lies:              Compact denial of existence: synthesize a minimally
#                           covering NSEC for a negative answer instead of
#                           returning the zone's precomputed NSEC records
#
#   add-transport-signal:    Automatically synthesize SVCB RRs
#                           (adds transport signals to Additional section)
#
# ZONEMD OPTIONS (RFC 8976):
#   publish-zonemd:          Maintain the apex ZONEMD RRset. The digest is
#                           computed and signed inside every publish, so
#                           ZONEMD.Serial always equals the SOA serial being
#                           served. Works on unsigned zones too; it is not part
#                           of the DNSSEC policy. While it is set, the apex
#                           ZONEMD belongs to the server: an UPDATE or API
#                           write to it is refused.
#                           STRIPPED on a tdns-auth secondary that mirrors an
#                           upstream zone (it would be originating content);
#                           kept on an inline-signing secondary, which
#                           re-signs and therefore originates already.
#
#   verify-zonemd:          Check the apex ZONEMD before adopting a zone, on
#                           every load from file and every inbound transfer.
#                           This is the secondary-side option: a secondary
#                           cannot re-derive a digest it was not given.
#                           NOT stripped on a mirroring secondary.
#
#   Both are parameterised by a per-zone `zonemd:` block, which is read only
#   when one of the options is set:
#
#       zonemd:
#          algorithms:           [ 1 ]     # 1 = SHA-384 (default), 2 = SHA-512
#          scheme:               1         # SIMPLE; the only scheme defined
#          on-verify-failure:    refuse    # refuse (default) | warn
#          wire-cache-max-bytes: 67108864  # 0/unset = 64 MiB, negative = off
#
#   wire-cache-max-bytes bounds the canonical-wire cache that lets a publish
#   re-render only the owner names it changed. Same sentinels as
#   ixfr-chain-max-bytes. It is a PER-ZONE figure: a server with many large
#   zones multiplies it, so it does not bound the host's memory on its own.
#   `tdns-cli auth zone zonemd status` reports what the cache holds and what
#   the last digest cost, so it can be sized from measurements.
#
# ZONE TRANSFER OPTIONS (SECONDARY ONLY):
#   request-ixfr:            Ask an upstream for an incremental transfer
#                           (IXFR, RFC 1995) rather than a full one, and apply
#                           the delta onto the zone already held. DEFAULT ON,
#                           so naming it turns nothing on -- it is how an
#                           operator states the intent explicitly. Any IXFR
#                           failure falls back to a full AXFR against the SAME
#                           upstream within the same refresh, so an enabled
#                           zone is never left worse off than a disabled one.
#                           A full AXFR is also what a zone gets when there is
#                           no delta to ask for: a forced retransfer, and any
#                           refresh with no baseline to apply a delta onto (no
#                           incoming serial yet, or nothing currently served).
#
#   no-request-ixfr:         Turn that default OFF: always ask for a full AXFR.
#                           Options are a list of enabled names, so absence
#                           cannot express "false" for a flag whose default is
#                           true; hence a second name rather than a value. If
#                           both are given, no-request-ixfr wins, because the
#                           safe direction is the one that only ever asks for a
#                           full transfer.
#
#   Both are IGNORED on a PRIMARY, where nothing consults them, and on a
#   secondary that signs its own content (online-signing or inline-signing),
#   whose baseline is its OWN signatures -- a delta computed against the
#   primary's copy names records such a zone does not hold. Either case is
#   reported as a ConfigWarning: the option does nothing, but the zone is fine
#   and keeps serving.
#
# MULTI-PROVIDER OPTIONS:
#   multi-provider:          Zone is served by several providers (RFC 8901).
#                           Changes signing and rollover behaviour; the
#                           multi-provider machinery lives in tdns-mp.
#
# CATALOG ZONE OPTIONS (RFC 9432):
#   catalog-zone:            Mark zone as RFC 9432 catalog zone
#                           (REQUIRED: catalog: configuration section must exist)
#                           (zone will contain member zone PTR records and group TXT records)
#
#   catalog-member-auto-create:   Auto-create member zones from this catalog
#                                (only valid on catalog zones — the same zone must
#                                 also carry the catalog-zone option)
#                                (when enabled, zones in catalog are automatically configured)
#
#   catalog-member-auto-delete:   Auto-delete member zones when removed from this catalog
#                                (only valid on catalog zones)
#                                (when enabled, removed zones are automatically deleted)
#
# INTERNAL / READ-ONLY OPTIONS (set by the server; NOT valid in options:)
#   These are real zone options, but they are set programmatically and are
#   REJECTED if they appear in a config file — the zone goes to ERROR state with
#   "unknown config option". They are listed here only so you recognize them in
#   `tdns-cli auth zone list` output.
#
#   dirty:                   Zone has pending modifications
#   frozen:                  Zone is locked against modifications (freeze/thaw API)
#   automatic-zone:          Zone was auto-created from a catalog
#   api-managed-zone:        Zone was created via the dynamic-zones API
#   multi-signer:            Set by the signer when HSYNC shows multiple signers
#   dont-publish-jwk:        Unused
#
# ==============================================================================

templates:
   # Basic primary zone template
   - name:            parent-primary
     type:            primary
     store:           map
     options:
        - delegation-sync-parent  # Provide delegation sync for children
     dnssecpolicy:    default
     delegationpolicy: manual

   # Primary zone with online signing
   - name:            signed-primary
     type:            primary
     store:           map
     options:
        - delegation-sync-parent
        - online-signing         # Sign on-the-fly
     dnssecpolicy:    default
     delegationpolicy: manual

   # Primary zone allowing dynamic updates
   - name:            dynamic-primary
     type:            primary
     store:           map
     options:
        - allow-updates          # Allow DNS UPDATE
        - delegation-sync-parent
        - online-signing
     dnssecpolicy:    default
     delegationpolicy: manual

   # Basic secondary zone template
   - name:            basic-secondary
     type:            secondary
     store:           map         # Default storage (serves normal DNS queries)
     # primaries: must be set per-zone or overridden

   # Secondary with child sync
   - name:            child-secondary
     type:            secondary
     store:           map
     options:
        - delegation-sync-child  # Push updates to parent

   # Hidden primary (doesn't notify, used with API)
   - name:            hidden-primary
     type:            primary
     store:           map
     # notify: intentionally empty - hidden primary doesn't notify
     # downstreams: intentionally empty - and nobody may transfer from it

   # Catalog zone template (primary catalog publisher)
   - name:            catalog-primary
     type:            primary
     store:           map
     options:
        - catalog-zone                   # RFC 9432 catalog zone
        - catalog-member-auto-create     # Auto-create member zones
        - catalog-member-auto-delete     # Auto-delete removed zones

   # Catalog zone template (secondary catalog consumer)
   - name:            catalog-secondary
     type:            secondary
     store:           map
     options:
        - catalog-zone                   # RFC 9432 catalog zone
        - catalog-member-auto-create     # Auto-create member zones
        - catalog-member-auto-delete     # Auto-delete removed zones
     # primaries: must be set per-zone

   # Read-only catalog (metadata only, no auto-configuration)
   - name:            catalog-readonly
     type:            secondary
     store:           map
     options:
        - catalog-zone                   # Parse catalog but don't auto-configure

   # Fast-rolling DNSSEC zone
   - name:            fast-roll-primary
     type:            primary
     store:           map
     options:
        - delegation-sync-parent
        - online-signing
     dnssecpolicy:    fastroll           # Use fast-rolling policy
     delegationpolicy: manual

   # Stealth primary (serves, but upstream fetches from it)
   - name:            stealth-primary
     type:            primary
     store:           map
     notify:
        - addr: "192.0.2.1:53"           # Notify public secondaries
          key:  NOKEY
        - addr: "192.0.2.2:53"
          key:  NOKEY
     downstreams:                        # ...and let them transfer
        - prefix: "192.0.2.1/32"         # single host — explicit mask required
          key:    NOKEY
        - prefix: "192.0.2.2/32"
          key:    NOKEY
     options:
        - delegation-sync-parent
        - online-signing
     dnssecpolicy:    default
     delegationpolicy: manual

   # Zonefile-pattern template: a zone that sets no zonefile: of its own gets
   # /etc/tdns/zones/<zonename>zone — note the trailing dot in the zone name
   # supplies the dot before "zone".
   - name:            pattern-primary
     type:            primary
     store:           map
     zonefile:        /etc/tdns/zones/%szone
     downstreams:
        - prefix: "2001:db8::/32"
          key:    NOKEY

   # API-instantiable dynamic-primary template (see DYNAMIC-ZONE BLESSING
   # above): `tdns-cli auth zone add -z <zone> --type primary --template
   # api-primary` mints a primary with this exact configuration — a
   # bootstrapped apex (SOA/NS/glue from listeners.addresses), updatable via
   # DNS UPDATE per the update policy below, persisted across restarts.
   - name:            api-primary
     dynamiczones:    true                    # operator blessing (gate 2)
     type:            primary
     store:           map
     zonefile:        /var/lib/tdns/zones/%szone
     options:
        - allow-updates
     updatepolicy:
        zone:
           type:     selfsub
           rrtypes:  [ TXT, A, AAAA ]
