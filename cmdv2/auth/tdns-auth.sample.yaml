# Main TDNS Configuration for tdns-auth
#
# This is the primary configuration file for the TDNS authoritative server.
# It includes references to separate configuration files for better organization:
#   - auth-templates.sample.yaml: Zone templates and all zone option documentation
#   - auth-zones.sample.yaml:     Zone declarations (rename to .yaml in production)
#   - dynamic-zones.yaml:         Auto-generated dynamic zones (created by server)
#
# An included file REPLACES what it names; it does not add to it. A file
# carrying zones: replaces the whole zones: list, so the two entries below work
# because each owns a different key (templates: and zones:) -- not because
# includes combine.
#
# To combine instead, ask per include:
#
#   include:
#      - auth-zones.yaml                 # replaces
#      - file: generated-zones.yaml
#        merge: true                     # combines
#
# Merging is limited to zones, templates, dnssec.policies,
# dnssec.large-algorithms and dnssec.split-algorithms. Everything else replaces
# even when merge: true -- notably dnsengine.addresses and apiserver.addresses,
# where combining would silently widen what the server listens on. See
# guide/configuration.md.
include:
   - auth-templates.sample.yaml          # Zone templates (rename to .yaml when deploying)
   - auth-zones.sample.yaml              # Zone declarations (rename to .yaml when deploying)
   # NOTE: do NOT include the dynamiczones configfile here. Dynamic zones are
   # loaded at startup on their own (with their API-managed/catalog markers);
   # including the file routes them through the static zone parser, which drops
   # the markers so they degrade to looking static. merge: true does not help:
   # it keeps both zone sets and still strips the markers.

service:
   name:              TDNS-AUTH
   identities:        [ ns.axfr.net., nsa.johani.org., foo.com. ]
   verbose:           true
   debug:             true     # writes processed zone to disk
   # Optional clamps on the SOA Refresh value used for secondary
   # zones. Both default in code (min 60s, max 8h) when unset.
   # Primaries are not affected (they reload from file on SIGHUP).
   # minrefresh:      60       # seconds, floor for SOA Refresh
   # maxrefresh:      1800     # seconds, ceiling for SOA Refresh

   transport:
      type:    svcb               # svcb | tsync | none; default is none
      signal:  "doq:20,dot:10"    # comma-sep list of doq,dot,doh,do53 with traffic share

# The listeners: block is the SAME schema in every tdns app (#446): where
# this daemon's DNS service listens. Authoritative-serving BEHAVIOR lives
# in authengine: below.
listeners:
   addresses:    [ 127.0.0.1:5354, '[::1]:5354' ]
   transports:   [ doq, dot, doh ]
   # Ports per encrypted transport. Defaults: doq 853, dot 853, doh 443.
   # NOTE: there is no listeners.ports.do53. Do53 always listens on the ports
   # embedded in listeners.addresses above.
   ports:
      doq:   [ 853 ]
      dot:   [ 853 ]
      doh:   [ 443 ]
   # certfile/keyfile are required for dot, doh and doq. If either is empty
   # those listeners are not started (do53 is unaffected).
   certfile:  /etc/tdns/certs/servers/localhost..crt
   keyfile:   /etc/tdns/certs/servers/localhost..key
   # NOTE: transfer authentication is PER ZONE (zone/template downstream-auth:
   # plus the peers' TLS fields tls-name/ca-file/pins/dane), enforced at transfer
   # time — there is no listener-level client-cert policy. See guide/xot.md.
   # The embedded resolver (imrengine: below) is INTERNAL and binds no
   # service listeners; uncomment for a loopback debug window into its cache:
   # imr-debug-address: 127.0.0.1:5959

authengine:
   # outbound-soa-serial controls the SOA serial advertised to secondaries:
   #   keep      — outbound = inbound serial (default; current behavior)
   #   unixtime  — outbound = time.Now().Unix() at zone load
   #   persist   — outbound = previously-saved outbound serial (DB-backed).
   #               Every BumpSerial writes the new value back. On clean
   #               restart with no zone change, the serial stays put, so
   #               secondaries don't see a regression and don't trigger
   #               an unnecessary AXFR. Recommended for primaries with
   #               BIND/Knot/etc. secondaries where serial-regression on
   #               restart would otherwise cause sync confusion.
   # outbound-soa-serial:  persist
   # options is a list of server-wide auth options. Recognized:
   #   minimal-responses        — omit authority NS RRset and apex glue from
   #                              positive answers (BIND-style). Referrals
   #                              and NXDOMAIN/NODATA paths are unaffected.
   #                              Bool; absence = false. "minimal-responses:false"
   #                              disables explicitly.
   #   parent-update:delta      — parent delegation update mode (delta only).
   # options:
   #    - minimal-responses

resignerengine:
   interval:  300    # seconds between runs. Reasonable value is likely ~3600
                     # clamped to the range 60..3600
   # NOTE: resignerengine.keygen is NOT read by the code. Key generation is
   # always internal. Left here only to document that the keys are not
   # produced by an external generator.
   # keygen:
   #    mode:       internal
   #    generator:  /usr/sbin/dnssec-keygen

imrengine:
   active:             true                    # true | false, default is true
   root-hints:         /etc/tdns/root.hints    # optional, default is compiled-in hints
   trust-anchor-file:  /etc/tdns/root.key      # not optional, no DNSSEC validation without this

apiserver:
   addresses:  [ 127.0.0.1:8989 ]
   apikey:     winter-is-coming-santa-stuck-in-chimney
   certfile:   /etc/tdns/certs/servers/localhost..crt
   keyfile:    /etc/tdns/certs/servers/localhost..key

# Statically declared TSIG keys.
#
# Every key named here is synced into the TSIG keystore in the database
# (db.file below) as an origin=config row at startup, and the live key cache is
# then rebuilt from the database. Keys may also be added at runtime with
#   tdns-cli auth keystore tsig add ...
# which stores them with origin=keystore. There is no separate keystore path:
# the keystore IS the db.file SQLite database.
#
# A key name referenced from a zone's primaries:, notify:, allow-notify: or
# downstreams: must resolve either here or in the keystore, otherwise that zone
# is quarantined at config load with "unknown key".
#
# NOKEY and BLOCKED are reserved ACL sentinels and may NOT be used as key names.
# Supported algorithms: hmac-sha1, hmac-sha224, hmac-sha256, hmac-sha384,
# hmac-sha512.
#
# owner: is an optional free-text provenance LABEL shown by
#   tdns-cli auth keystore tsig list
# It does not scope the key to a zone and grants no authority of its own. It
# defaults to the key's origin ("config" for entries declared here).
keys:
   tsig:
      # The two keys referenced by the tsig-acl.example. zone in
      # auth-zones.sample.yaml. Generate a secret with e.g.
      #   openssl rand -base64 32
      # and prefer adding it via `tdns-cli auth keystore tsig add --secret-file`
      # over pasting it into a config file.
      - name:       xfr-key-2026.
        algorithm:  hmac-sha256
        secret:     "REPLACE-ME-base64-secret-for-the-2026-key="
        owner:      rollover-2026   # optional label, not a zone scope

      - name:       xfr-key-2025.   # kept alive during the rotation overlap
        algorithm:  hmac-sha256
        secret:     "REPLACE-ME-base64-secret-for-the-2025-key="
        owner:      rollover-2025

server:
   id:        ooga booga boo
   version:   tdns-server {version}
   hostname:  there-is-no-place-like-127.0.0.1

childsync:                 # What to do when we are the child
   # NOTE: only update-ns, update-a and update-aaaa are read from this block.
   # Child scheme selection is configured under delegationsync.child.schemes
   # below; childsync.schemes / sync-on-boot / syncwithparent are NOT read.
   update-ns:       true
   update-a:        true
   update-aaaa:     true

# Named delegation backends for parent zones that receive child UPDATEs.
# Predefined: "db" and "direct" (no config needed).
#
# A zone that has 'allow-child-updates' MUST specify a 'delegationbackend:'.
# Without one the read path (scanner) and write path (zone updater) disagree
# on where current delegation data lives, and DS/NS records accumulate
# without ever being removed.
# delegationbackends:
#   - name:       files-dnslab
#     type:       zonefile
#     directory:  /var/lib/tdns/delegations/dnslab

delegationsync:
   parent:
      # in parent zones, we support these schemes, and will publish DSYNC RRs
      # if allowed to:
      schemes:  [ notify, update ]
      notify:
         types:      [ CDS, CSYNC ]
         port:       5354                      # MUST be a port the dnsengine listens on
         target:     notifications.{ZONENAME}  # {ZONENAME} expanded at run-time
         addresses:  [ 127.0.0.1, '::1' ]      # no port and no '[]' around v6 here
      update:
         types:      [ ANY ]
         port:       5354                      # MUST be a port the dnsengine listens on
         target:     updates.{ZONENAME}
         addresses:  [ 127.0.0.1, '::1' ]
         keygen:
            # Only `algorithm` is read on the parent side; `mode` and
            # `generator` are not.
            algorithm:  ED25519

      # The API scheme (docs/2026-08-11-dsync-api-scheme.md): for children that
      # cannot sign a DNS message and therefore cannot use the UPDATE scheme.
      # Not in `schemes:` above, so none of this is published until you put it
      # there. Prefer UPDATE where the child can manage it.
      #
      # Three records are published, all in one update:
      #    _dsync.{ZONENAME}   DSYNC CDS API 443 dsync-api.{ZONENAME}
      #    dsync-api.{ZONENAME} URI  1 1 "https://dsync-api.{ZONENAME}:443/dsync/v1"
      #    dsync-api.{ZONENAME} TXT  "tdns-child-api-v1.0"
      #
      # Note that unlike notify/update the target is NOT a host that receives
      # DNS -- it is where the URI and TXT describing the endpoint live. Hence
      # no `addresses:` is required: the URI's own host resolves normally. Set
      # addresses only if the target is a name this zone serves and nothing
      # else publishes its address.
      #
      # A child will refuse this endpoint unless the parent zone is signed and
      # these records validate: the credential is a bearer token, so an
      # unvalidated lookup could send it to an attacker.
      # api:
      #    types:     [ CDS, CSYNC ]
      #    target:    dsync-api.{ZONENAME}     # {ZONENAME} expanded at run-time
      #    baseurl:   "https://{TARGET}:{PORT}/dsync/v1"   # both {} are required
      #    port:      443
      #    dialect:   tdns-child-api-v1.0      # published in the TXT
      #    listen:    [ "0.0.0.0:443" ]        # the DSYNC-API listener
      #    cert:      /etc/tdns/dsync-api.crt
      #    key:       /etc/tdns/dsync-api.key

   child:
      # in child zones, we attempt the following schemes, if the parent supports
      # them and we're allowed to modify the child zone (adding CDS, CSYNC, KEY
      # RRs, re-signing, etc):
      #
      # Preference order. Put "api" last: it is the fallback for children that
      # cannot sign a DNS message, not the first choice. It also requires the
      # PARENT zone to be signed -- the endpoint is discovered from DNS and the
      # credential is a bearer token, so an unvalidated lookup could send it to
      # an attacker.
      schemes:  [ notify, update ]      # REQUIRED for child-side delegation sync

      # Credentials for the api scheme, one per parent, obtained out of band
      # from the parent operator. Without one, a parent offering only "api"
      # logs a single line saying so and does not retry -- a credential cannot
      # arrive by retrying.
      #
      # A LIST, not a map keyed by parent name: viper splits keys on ".", so a
      # map key like "example." gets split and the credential reads back empty
      # with nothing logged anywhere.
      # api:
      #    credentials:
      #       - parent:   example.
      #         username: child1.example.
      #         key:      REPLACE-ME
      #    # Permits BOTH a plain-http endpoint and one discovered without
      #    # DNSSEC validation. Deliberately one switch: they are the same
      #    # protection from two sides, and turning off one while believing
      #    # the other holds leaves none. Lab only.
      #    allow-insecure: false
      update:
         keygen:
            # `algorithm` and `generator` are read on the child side; `mode` is not.
            generator:  /opt/local/bin/dnssec-keygen
            algorithm:  ED25519

scanner:
   interval:  30                        # seconds between periodic scan runs
   options:   [ no-dnssec-validation ]
   # options: [ at-apex ]                  # RFC 8078 opportunistic onboarding
   # options: [ at-ns ]                    # RFC 9615 signaling name verification
   # options: [ no-dnssec-validation ]     # accept CDS without DNSSEC (lab only)
   at-apex:
      checks:    1     # consecutive all-NS checks before accepting (default: 1)
      interval:  300   # seconds between checks (default: 300)

# NOTE: there is no `keybootstrap:` config block. The key-bootstrap knobs the
# code actually reads are:
#   keystate.require_manual_bootstrap   (bool)
#   keystate.allow_auto_bootstrap       (bool)
#   verifyengine.attempts               (default 3)
#   verifyengine.retry_interval         (default 60, seconds)
# Per-zone bootstrap methods are set under a zone's updatepolicy.child.keybootstrap.

# DNSSEC policies. Each policy is referenced from a zone's `dnssecpolicy:`
# field (one word: no underscore, no hyphen). The rollover, ttls, and clamping
# subtrees are optional; omitting them gives a static-key policy with no
# automated rollover.
#
# Rollover (Phase 4 of the automated KSK rollover plan):
#   method: none | multi-ds | double-signature
#     - none             — no rollover; KSKs stay active forever
#     - multi-ds         — RFC 7583 §3.3.3 generalized; preferred
#     - double-signature — RFC 7583 §3.3.1; not yet implemented (4E)
#   num-ds: pipeline depth for multi-ds (default 3)
#   parent-agent: host:port of the parent's authoritative agent that
#     responds to DS queries. REQUIRED when method != none. Used to
#     observe DS publication after a push.
#   confirm-initial-wait / confirm-poll-max / confirm-timeout: timing
#     for the parent-DS observation backoff loop.
#
# TTLs:
#   dnskey: zone-owner choice for the DNSKEY RRset TTL at steady state.
#
# Clamping (Phase 4D K-step TTL clamping; §5.2 of the design doc):
#   enabled: when true, the signer clamps every served TTL to
#     min(operator_ttl, K * margin) as the next rollover approaches,
#     so that no cached record outlives the retired-KSK hold window.
#     K decrements stepwise from K_max = ksk.lifetime / margin down to
#     1 in the final margin window, resetting to K_max post-rollover.
#   margin: REQUIRED when enabled: true. Both the floor TTL near
#     rollover and the retired-KSK hold time. A reasonable default
#     value is 1h. No silent default — config parse fails closed if
#     omitted.
#
# All DNSSEC configuration lives under this one block: deployment-wide
# guardrails (large-algorithms, split-algorithms), the named policies that
# zones reference (dnssec.policies:), and the key/signing policy for the
# KeyStateWorker (dnssec.kasp:).
dnssec:
   # DNSSEC completeness mode (deployment-wide, RFC 4035 §2.2):
   #   strict  (default) - a ZSK algorithm rollover keeps the old-algorithm
   #                       key signing through the drain window (maintained
   #                       double-signature); zones stay §4035-conformant.
   #   relaxed           - alg-split regime: the old key drops at the switch
   #                       (drain only, no maintained double-signature). Sound
   #                       because completeness binds the signer, not the
   #                       validator. Needed for the cheap PQ ZSK-alg roll.
   # NOT per-zone/per-policy: it is a property of which validators must be
   # satisfied, constant across a policy transition. Unknown value = hard
   # config error.
   completeness: strict

   # Algorithm NAMES treated as "large" for IMR DNSKEY-over-TCP and signer
   # warnings. RSASHA512 is a stand-in where ML-DSA-44 is unavailable. Names,
   # not codepoints: non-standardized PQ codepoints are assigned per
   # deployment at runtime, so a bare number could mean different algorithms
   # on the IMR and the signer. A name this binary's registry doesn't know is
   # a hard config error (the server refuses to start).
   large-algorithms: [ RSASHA512 ]

   # split-algorithms gates which KSK/ZSK algorithm PAIRS a policy may use when
   # the two roles differ. A policy whose ksk.algorithm != zsk.algorithm is
   # REJECTED at config parse (fail closed) unless that exact pair is listed
   # here. Same-algorithm policies are always allowed and need no entry.
   #
   # Keyed by KSK algorithm name; the value lists the ZSK algorithm names that
   # KSK is permitted to pair with. Use this to allow a large/PQ KSK with a
   # small classical ZSK while forbidding combinations you don't want to run.
   #
   # The RSASHA512 entry below authorizes the "large-ksk" policy further down
   # (RSASHA512 KSK + ECDSAP256SHA256 ZSK). Remove it and that policy fails to
   # load.
   split-algorithms:
      RSASHA512: [ ED25519, ECDSAP256SHA256 ]
      # Example with PQ algorithms (registered at runtime by the binary):
      # FALCON512: [ ED25519, ECDSAP256SHA256 ]
      # MAYO1:     [ ED25519 ]

   # Named DNSSEC policy TEMPLATES. A template is a partial policy: any policy
   # below may set `template: <name>` to inherit this template's settings for
   # the fields it does not specify itself. Inheritance is a DEEP merge — a
   # policy that sets only some fields of a nested block (ksk, zsk, rollover,
   # ttls, sigvalidity, clamping) inherits the rest of that block from the
   # template; the policy's own values always win. Templates are not usable
   # policies themselves (a zone cannot reference a template).
   #
   # Caveat: inheritance fills only the fields a policy leaves UNSET, so a
   # policy cannot override a template value back to an empty/zero value (e.g.
   # it cannot set clamping.enabled back to false once the template enabled it).
   templates:
      # Shared cadence, signature validity, rollover and TTLs. Policies that
      # reference this template need only declare their own key lifetimes.
      base:
         algorithm:  ED25519
         # mode selects the key scheme:
         #   ksk-zsk  (default) — separate Key-Signing + Zone-Signing keys.
         #   csk                — a single Combined-Signing Key does both roles.
         # Omitted → ksk-zsk. An invalid value is rejected at config load.
         mode:  ksk-zsk
         sigvalidity:
            default:  14d
            dnskey:   30d
            ds:       14d
         rollover:
            method:                multi-ds
            num-ds:                3
            parent-agent:          127.0.0.1:5354
            confirm-initial-wait:  2s
            confirm-poll-max:      60s
            confirm-timeout:       1h
         ttls:
            dnskey:  2h

   # Named DNSSEC policies. Each zone references one via its dnssecpolicy:
   # field. A policy that sets different ksk.algorithm and zsk.algorithm must
   # have that pair allowlisted in dnssec.split-algorithms above, or config
   # load fails. A policy may also set `template: <name>` to inherit defaults
   # from a template in dnssec.templates above.
   policies:
      # Inherits algorithm, sigvalidity, rollover and ttls from the `base`
      # template above and sets only its own key lifetimes. This is the deep
      # merge in action: the whole rollover/ttls/sigvalidity blocks come from
      # base, while ksk/zsk here are the policy's own.
      from-template:
         template:  base
         ksk:
            lifetime:  90d
         zsk:
            lifetime:  30d
         csk:
            lifetime:  none

      # Static KSK, no automated rollover. Useful for zones whose operators
      # want manual control over key cycles.
      default:
         algorithm:  ED25519
         ksk:
            lifetime:  forever
         zsk:
            lifetime:  forever
         csk:
            lifetime:  none
         sigvalidity:
            default:  14d
            dnskey:   30d
            ds:       14d
         # rollover: omitted → method: none (static keys)
         # clamping: omitted → disabled (no TTL clamping)

      # Large KSK (RSASHA512) + small ZSK for UDP-friendly zone signatures.
      # The differing KSK/ZSK algorithms require an entry in
      # dnssec.split-algorithms (RSASHA512: [ ..., ECDSAP256SHA256 ]) above —
      # without it this policy is rejected at config load.
      large-ksk:
         algorithm:  ECDSAP256SHA256
         ksk:
            algorithm:  RSASHA512
            lifetime:   90d
         zsk:
            algorithm:  ECDSAP256SHA256
            lifetime:   30d
         csk:
            lifetime:  none
         sigvalidity:
            default:  14d
            dnskey:   30d
            ds:       14d

      # Rapid-cadence policy with automated KSK rollover. Suitable for
      # testing / experimentation.
      fastroll:
         algorithm:  ED25519
         ksk:
            lifetime:  48h
         zsk:
            lifetime:  12h   # drives automated ZSK rollover (KeyStateWorker)
         csk:
            lifetime:  none
         sigvalidity:
            default:  14d
            dnskey:   30d
            ds:       14d
         rollover:
            method:                multi-ds
            num-ds:                3                  # pipeline depth
            parent-agent:          127.0.0.1:5354     # parent's agent for DS observation
            confirm-initial-wait:  2s
            confirm-poll-max:      60s
            confirm-timeout:       1h
         ttls:
            dnskey:      2h            # operator-configured DNSKEY TTL
            # max-served: 5m           # OPTIONAL steady-state ceiling on every served
                                       # TTL in the zone. Set to enforce low TTLs on
                                       # zones whose source data has high TTLs that
                                       # the operator can't directly edit (e.g.
                                       # inbound zone transfers, provisioning systems
                                       # that publish 1h+ TTLs). When set, SignRRset
                                       # writes min(operator_ttl, max-served) to
                                       # every RR header TTL and the RRSIG covers
                                       # the clamped value. Composes with K-step
                                       # rollover clamping: effective ceiling is
                                       # min(K*margin, max-served). Must be >= 60s.
         clamping:
            enabled:  true         # K-step TTL clamping near rollover
            margin:   1h           # REQUIRED when enabled: true
                                   # — floor TTL near rollover
                                   # — retired-KSK hold time

   # Key and Signing Policy (KASP). Controls the KeyStateWorker's automatic
   # key state transitions and standby key maintenance. The KeyStateWorker
   # runs periodically to:
   #   - Transition published keys to standby after propagation-delay
   #   - Transition retired keys to removed after propagation-delay
   #   - Generate new standby keys when count drops below configured thresholds
   kasp:
      propagation-delay:  1h     # Wait time before published→standby and retired→removed
                                 # transitions for non-rollover zones. Also used by the
                                 # rollover worker's pending-child-publish phase.
      check-interval:     1m     # How often the KeyStateWorker runs its checks
      standby-zsk-count:  1      # Number of standby ZSKs to maintain per zone (0 = no standby)
      standby-ksk-count:  0      # Number of standby KSKs to maintain per zone (0 = no standby).
                                 # NOTE: For zones with rollover.method != none, the rollover
                                 # pipeline-fill (Phase 4A) generates KSKs up to rollover.num-ds
                                 # automatically; standby-ksk-count is independent of that.

# Catalog zone configuration (RFC 9432)
# Required if any zone has the 'catalog-zone' option enabled.
#
# Catalog zones allow centralized management of zone membership across multiple
# servers. Member zones can be automatically configured on secondary servers
# based on catalog content.
#
# Per-catalog-zone control:
#   Use 'catalog-member-auto-create' option on catalog zones to enable auto-configuration
#   Use 'catalog-member-auto-delete' option on catalog zones to enable auto-deletion
#
catalog:
   # Group type prefixes (REQUIRED - defines which groups have special semantics)
   # These prefixes identify group types in catalog zones and trigger special behavior.
   # Use "none" to disable a group type (no special semantics, all groups are ordinary).
   #
   # Example catalog zone record format:
   #   group.{uniqueid}.zones.{catalog}.  IN TXT  "{groupname}"
   #
   # Group types:
   #   - Config groups:  Used for auto-configuration (contain transfer settings)
   #   - Signing groups: Used for documentation/grouping (no auto-config semantics)
   #   - Service groups: General-purpose groups (no special semantics)
   #
   group-prefixes:
      config:   "config"    # Prefix for config/transfer groups (e.g., "configKdc", "configEdge")
                            # Groups starting with this prefix define transfer settings
                            # Only ONE config group allowed per member zone
      signing:  "sign"      # Prefix for signing groups (e.g., "signEdge", "signKdc")
                            # Groups starting with this prefix indicate signing responsibility
                            # Only ONE signing group allowed per member zone

   # Config groups define zone transfer settings for auto-configuration.
   # When a catalog zone has 'catalog-member-auto-create' option enabled,
   # member zones with config groups are automatically configured using
   # these settings.
   #
   # Only ONE config group allowed per member zone (enforced if prefix != "none")
   config-groups:
      kdc:                          # Group name (matches "configkdc" in catalog zone)
         upstream:  "127.0.0.1:5353"   # Where to AXFR member zones from (REQUIRED)
         tsig-key:  ""                 # Optional TSIG key name for authentication
         store:     map                # Zone store type: map (default) or xfr
                                       # - map:   Default, general-purpose (recommended)
                                       # - xfr:   Zone transfer only (AXFR, NO normal queries)
         options:   []                 # Optional zone options to apply to member zones
                                       # Example: ["delegation-sync-child"]

      edge:                         # Group name (matches "configedge" in catalog zone)
         upstream:  "192.0.2.1:5353"
         tsig-key:  ""
         store:     map                # Default storage (recommended)
         options:   []                 # e.g. ["delegation-sync-child"]

   # Signing groups (documentation/informational only, not used for auto-configuration).
   # These groups can be used to indicate which signing infrastructure is
   # responsible for a zone, but they don't trigger any automatic configuration.
   #
   # Only ONE signing group allowed per member zone (enforced if prefix != "none")
   signing-groups:
      edge_zsk:                     # Group name (matches "signedge_zsk" in catalog zone)
         description:  "Edge signing with ZSK only"
      kdc:                          # Group name (matches "signkdc" in catalog zone)
         description:  "Central signing at KDC"

# Dynamic zones persistence configuration.
# Controls persistence for dynamically configured zones (catalog zones,
# catalog member zones, and API-created zones).
dynamiczones:
   # Absolute path to YAML file where dynamic zone configs are stored.
   # Loaded automatically at startup — do NOT add it to include: (see the
   # note in the include: section above).
   # Server must have write access to this file.
   configfile:     /var/lib/tdns/dynamic-zones.yaml

   # Absolute path to directory where zone files are written.
   # Server must have write access to this directory.
   zonedirectory:  /var/lib/tdns/zones

   # Configuration for catalog zones (primary catalog zone publishers)
   catalog-zones:
      allowed:  true             # Whether dynamic creation of catalog zones is allowed
      storage:  persistent       # "memory" or "persistent" - default: "memory"

   # Configuration for catalog member zones (secondary zones from catalog)
   catalog-members:
      allowed:  true             # Whether catalog member zones are allowed
      storage:  persistent       # "memory" or "persistent" - default: "memory"

   # Configuration for direct API-created zones (zone add/delete/modify).
   # allowed: is a LIST of zone types the API may create — secondary
   # (transfer-provisioned) and/or primary (template-provisioned; the
   # template must carry dynamiczones: true, see auth-templates.sample.yaml).
   # Absent/empty means deny all. NOTE: the pre-2026-07 bool form
   # (allowed: true/false) is a hard config error naming this syntax.
   dynamic:
      allowed:  [ ]              # e.g. [ secondary ] or [ secondary, primary ]
      storage:  memory           # "memory" or "persistent" - default: "memory"

db:
   file:  /var/lib/tdns/tdns-auth.db

# The keystore lives inside the db above, which is a poor home for key material
# that has to outlive the machine: it cannot be reviewed, diffed or committed,
# and losing it loses every key for every zone this server signs.
#
# 'keystore <class> bulk-export --dest DIR' writes a selected subset out as
# BIND-convention key files plus a manifest; naming that directory here restores
# it at every startup. The load happens BEFORE zones are parsed, so a signed zone
# finds its keys already present and adopts them instead of minting replacements
# that no parent's DS will match.
#
# Setting a directory is the whole switch — there is no separate enable flag.
# Pre-load is create-if-absent by default: a key already in the keystore is never
# overwritten from disk (a stale export would otherwise silently un-roll a rolled
# key on every restart). Conflicts are logged at WARN; to overwrite once and
# deliberately, use 'keystore <class> bulk-import --force'.
#
# keystore:
#    preload:
#       dnssec:  /etc/tdns/keys/dnssec
#       sig0:    /etc/tdns/keys/sig0
#       tsig:    /etc/tdns/keys/tsig
#
#       # DANGEROUS. Inverts the rule above for every class listed: an on-disk
#       # key that differs REPLACES the keystore's copy instead of being skipped.
#       #
#       # Set this only where the exported directory is the source of truth and
#       # the keystore is disposable — a host rebuilt from a config repo, e.g. a
#       # training lab. It makes such a build scriptable with no manual step.
#       #
#       # Do NOT set it on a host whose keystore is authoritative. Unlike the
#       # one-shot 'bulk-import --force', this stays armed on every restart, so a
#       # stale committed export can silently revert a key you rolled by hand
#       # long afterwards. Every replacement is logged at WARN, and the setting
#       # is announced at WARN on each boot.
#       overwrite-existing-keys:  false

log:
   file:   /var/log/axfr.net/tdns-auth.log

   # Global log level, applied to every subsystem unless overridden below.
   # One of: debug | info | warn | error   (empty defaults to info)
   level:  info

   # Per-subsystem level overrides. A subsystem uses the global 'level' above
   # unless listed here. The subsystem name is the tag shown after the level in
   # each log line, e.g. a line tagged "[INFO/zones]" is the "zones" subsystem.
   #
   # Commonly useful subsystems for tdns-auth:
   #   config     config-file parsing and reload
   #   zones      zone load, dynamic zones, AXFR/IXFR (in and out)
   #   dns        DNS query / lookup / resolution
   #   engine     refresh engine + internal resolver (IMR) engine
   #   handler    DNS request handlers
   #   api        HTTP management API
   #   signer     DNSSEC signing and the key-state worker
   #   rollover   DNSSEC key rollover
   #   conn-retry connection retries (defaults to 'error' to reduce noise;
   #              set to debug/info to see it)
   #   CDS, CSYNC, DNSKEY, GENERIC   inbound NOTIFY handling, per RR type
   # Other subsystems (present, used by specific features / app types):
   #   agent, combiner, gossip, transport, elect, provider-group, signal-republish
   #
   # subsystems:
   #   dns:        debug
   #   zones:      debug
   #   conn-retry: info

common:
   # NOTE: only common.command is read. common.servername is not.
   command:     /usr/local/libexec/tdns-auth

# Registrars are declared here, including where they want notifications/updates.
# There is a mapping from child zones (per parent zone) to these registrars and
# that will (should) cause a runtime generation of a suitable DSYNC RRset in
# response to queries for child._dsync.parent. DSYNC
registrars:
   ooga-reg:
      - child._dsync.parent.   IN DSYNC CDS    NOTIFY 5354 notifications.ooga-reg.axfr.net.
      - child._dsync.parent.   IN DSYNC CSYNC  NOTIFY 5354 notifications.ooga-reg.axfr.net.
      - child._dsync.parent.   IN DSYNC ANY    UPDATE 5354 updates.ooga-reg.axfr.net.
   booga-reg:
      - child._dsync.parent.   IN DSYNC CDS    NOTIFY 5354 notifications.booga-reg.axfr.net.
      - child._dsync.parent.   IN DSYNC CSYNC  NOTIFY 5354 notifications.booga-reg.axfr.net.
      - child._dsync.parent.   IN DSYNC ANY    UPDATE 5354 notifications.booga-reg.axfr.net.
   mooga-reg:
      - child._dsync.parent.   IN DSYNC CDS    NOTIFY 5354 notifications.mooga-reg.axfr.net.
      - child._dsync.parent.   IN DSYNC CSYNC  NOTIFY 5354 notifications.mooga-reg.axfr.net.
      - child._dsync.parent.   IN DSYNC ANY    UPDATE 5354 notifications.mooga-reg.axfr.net.

# journal: -- the delta journal (persistence of zone updates).
#
# Changes applied through DDNS or the management API are recorded here and
# replayed over the zone file on load, so a restart loses nothing. Inspect a
# zone's journal with "tdns-cli auth zone journal status --zone <zone>".
#
# active: is a KILL-SWITCH, not a tuning knob. Absent (or true) means ON, which
# is what you want: leaving it out is the correct configuration. Set it to false
# only to stop the journal deployment-wide -- for instance if persistence itself
# is misbehaving and you need updates flowing again before the fix ships.
#
# With it off, updates are still applied and served; they simply do not survive
# a restart. An EXISTING journal is still replayed on load, so turning it off
# never discards what has already been recorded.
#
# journal:
#    active: false
